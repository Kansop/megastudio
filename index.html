<!doctype html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MegaStudio — all-in-one productivity &amp; creativity studio</title>
<meta name="description" content="MegaStudio: notes, kanban, calendar, spreadsheet, paint, music, code playground, games and more — offline, in your browser.">
<meta name="theme-color" content="#0f1222">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand" title="MegaStudio">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <span class="brand-name">MegaStudio</span>
    </div>
    <button id="palette-btn" class="search-btn" title="Command palette (Ctrl+K)">
      <span>🔎 Search or run…</span><kbd>Ctrl K</kbd>
    </button>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <button id="collapse-btn" class="icon-btn" title="Collapse sidebar (Ctrl+B)">⇤</button>
      <span id="save-status" class="muted small">Saved</span>
    </div>
  </aside>
  <main id="main">
    <header id="topbar">
      <button id="menu-btn" class="icon-btn" aria-label="Menu">☰</button>
      <h1 id="app-title">Dashboard</h1>
      <div id="app-actions"></div>
      <div class="spacer"></div>
      <button id="theme-btn" class="icon-btn" title="Cycle theme (Ctrl+Shift+L)">🎨</button>
      <button id="help-btn" class="icon-btn" title="Keyboard shortcuts (?)">⌨</button>
    </header>
    <section id="view" tabindex="-1"></section>
  </main>
</div>
<div id="palette" class="overlay hidden" role="dialog" aria-modal="true">
  <div class="palette-box">
    <input id="palette-input" placeholder="Type a command, app, note, or file…" autocomplete="off" spellcheck="false">
    <ul id="palette-list"></ul>
    <div class="palette-hint muted small">↑↓ to navigate · Enter to run · Esc to close</div>
  </div>
</div>
<div id="modal" class="overlay hidden"><div class="modal-box"></div></div>
<div id="toasts"></div>
<noscript>MegaStudio needs JavaScript.</noscript>
<script src="js/core.js"></script>
<script src="js/md.js"></script>
<script src="js/gif.js"></script>
<script src="js/qr.js"></script>
<script src="js/apps/dashboard.js"></script>
<script src="js/apps/notes.js"></script>
<script src="js/apps/writer.js"></script>
<script src="js/apps/kanban.js"></script>
<script src="js/apps/calendar.js"></script>
<script src="js/apps/sheets.js"></script>
<script src="js/apps/paint.js"></script>
<script src="js/apps/music.js"></script>
<script src="js/apps/code.js"></script>
<script src="js/apps/files.js"></script>
<script src="js/apps/maps.js"></script>
<script src="js/apps/weather.js"></script>
<script src="js/apps/games.js"></script>
<script src="js/apps/games2.js"></script>
<script src="js/apps/chess.js"></script>
<script src="js/apps/games3.js"></script>
<script src="js/apps/games4.js"></script>
<script src="js/apps/physics.js"></script>
<script src="js/apps/focus.js"></script>
<script src="js/apps/flashcards.js"></script>
<script src="js/apps/whiteboard.js"></script>
<script src="js/apps/slides.js"></script>
<script src="js/apps/toolbox.js"></script>
<script src="js/apps/graph.js"></script>
<script src="js/apps/pixel.js"></script>
<script src="js/apps/voxel.js"></script>
<script src="js/apps/fractal.js"></script>
<script src="js/apps/budget.js"></script>
<script src="js/apps/database.js"></script>
<script src="js/apps/botchat.js"></script>
<script src="js/apps/gantt.js"></script>
<script src="js/apps/inbox.js"></script>
<script src="js/apps/recorder.js"></script>
<script src="js/apps/video.js"></script>
<script src="js/apps/photo.js"></script>
<script src="js/apps/terminal.js"></script>
<script src="js/apps/settings.js"></script>
<script src="js/boot.js"></script>
<script src="js/tour.js"></script>
</body>
</html>
